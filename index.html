<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Máy Ảnh - The Digicam Y2K</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-camera-retro text-amber-400"></i> The Digicam Y2K
            </a>
            <div class="flex items-center gap-6">
                <nav class="hidden md:flex gap-6 text-sm font-medium items-center">
                    <a href="index.html" class="hover:text-amber-400 transition">Trang chủ</a>
                    <a href="products.html" class="text-amber-400 font-semibold transition">Máy ảnh</a>
                    <a href="accessories.html" class="hover:text-amber-400 transition">Phụ kiện</a>
                    <a href="blog.html" class="hover:text-amber-400 transition">Blog</a>
                </nav>
                <button onclick="toggleCart()" class="relative bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition shadow">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Giỏ hàng</span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="bg-slate-900 text-white py-10 text-center">
        <h1 class="text-3xl font-bold">Danh Sách Máy Ảnh Vintage</h1>
        <p class="text-gray-400 text-sm mt-2">Chọn mẫu máy ưng ý để xem chi tiết thông số</p>
    </div>

    <!-- Danh sách máy ảnh -->
    <main class="container mx-auto px-4 py-12">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Load tự động -->
        </div>
    </main>

    <!-- Giỏ hàng Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end transition-opacity">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-amber-500"></i> Giỏ hàng</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow space-y-4 overflow-y-auto pr-1"><p class="text-gray-500 text-center py-8">Trống trơn!</p></div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between items-center mb-4 text-lg font-bold"><span>Tổng cộng:</span><span id="cart-total" class="text-amber-600">0đ</span></div>
                <button onclick="openCheckoutModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition shadow">Thanh toán QR</button>
            </div>
        </div>
    </div>

    <!-- Modal QR -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeCheckoutModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h3 class="text-xl font-bold text-center mb-2">Quét mã QR thanh toán</h3>
            <div class="flex justify-center mb-4"><div class="border-4 border-amber-400 rounded-xl p-2 bg-white"><img id="qr-code-img" src="" class="w-56 h-56 object-contain"></div></div>
            <div class="bg-gray-50 p-3 rounded-xl text-sm mb-4 space-y-1">
                <div class="flex justify-between"><span class="text-gray-500">Số tiền:</span><span id="qr-total-amount" class="font-bold text-red-600">0đ</span></div>
            </div>
            <button onclick="confirmOrder()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl">Đã chuyển khoản</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>renderProducts(); saveAndRenderCart();</script>
</body>
</html>
